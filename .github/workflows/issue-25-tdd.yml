# Temporary fork-only harness; remove before proposing the code fix upstream.
name: Issue 25 MCP TDD
on:
  push:
    branches: ['zom-2018/fix-issue-25-subminute-learning-steps']
permissions:
  contents: read
concurrency:
  group: issue-25-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'zom-2018/amgi'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
      - run: brew install protobuf swift-protobuf xcodegen
      - run: ./scripts/build-xcframework.sh
      - run: ./scripts/generate-protos.sh
      - run: cd AmgiApp && xcodegen generate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Install isolated MCP tooling
        run: |
          mkdir -p "$RUNNER_TEMP/amgi-mcp"
          cd "$RUNNER_TEMP/amgi-mcp"
          node -e 'require("node:fs").writeFileSync("package.json", JSON.stringify({private:true,type:"module"}))'
          pnpm add --ignore-scripts xcodebuildmcp@2.7.0 @modelcontextprotocol/sdk@1.31.0
      - name: Focused RED or GREEN, full suite, device build through MCP
        env:
          SENTRY_DISABLED: '1'
          XCODEBUILDMCP_ENABLED_WORKFLOWS: session-management,simulator,device
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/amgi-mcp"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          const client = new Client({name:'amgi-fork-tdd',version:'1.0.0'});
          const transport = new StdioClientTransport({
            command:process.execPath,
            args:[`${process.cwd()}/node_modules/xcodebuildmcp/build/cli.js`,'mcp'],
            env:process.env,
            stderr:'inherit',
          });
          async function call(name, args, evidenceName = name) {
            const result = await client.callTool({name,arguments:args},undefined,{timeout:1800000});
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/evidence/${evidenceName}.json`,JSON.stringify(result,null,2));
            for (const content of result.content ?? []) if (content.type === 'text') console.log(content.text);
            if (result.isError || result.structuredContent?.didError) throw new Error(`${evidenceName} failed; see evidence`);
            if (name === 'test_sim') {
              const counts = result.structuredContent?.data?.summary?.counts;
              if (!counts || counts.passed < (evidenceName === 'focused-tests' ? 4 : 1) || counts.failed !== 0) {
                throw new Error(`${evidenceName}: missing, incomplete or failing executed-test counts`);
              }
            }
            return result;
          }
          try {
            await client.connect(transport);
            await call('session_set_defaults',{
              projectPath:`${process.env.GITHUB_WORKSPACE}/AmgiApp/AmgiApp.xcodeproj`,
              scheme:'AmgiApp',configuration:'Debug',simulatorName:'iPhone 17 Pro Max',
              derivedDataPath:`${process.env.RUNNER_TEMP}/DerivedData`,preferXcodebuild:true,
            });
            const flags = ['-skipPackagePluginValidation','-skipMacroValidation'];
            await call('test_sim',{extraArgs:[...flags,'-only-testing:DecksFeatureTests/DeckConfigStepsTests'],progress:false},'focused-tests');
            await call('test_sim',{extraArgs:flags,progress:false},'full-suite');
            await call('session_set_defaults',{configuration:'Release'},'release-defaults');
            const build = await call('build_device',{extraArgs:[...flags,'CODE_SIGNING_ALLOWED=NO','CODE_SIGNING_REQUIRED=NO','CODE_SIGN_IDENTITY=']});
            const appPath = build.structuredContent?.data?.artifacts?.appPath;
            if (!appPath || !fs.statSync(appPath).isDirectory()) throw new Error('MCP did not return a built .app path');
            fs.appendFileSync(process.env.GITHUB_ENV,`APP_PATH=${appPath}\n`);
          } finally { await client.close(); }
          JS
      - name: Package unsigned application (Apple-ID sideload signing still required)
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry AmgiApp-unsigned.ipa Payload
          shasum -a 256 AmgiApp-unsigned.ipa | tee "$RUNNER_TEMP/evidence/ipa-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AmgiApp-unsigned-ipa
          path: ${{ runner.temp }}/ipa/AmgiApp-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-25-mcp-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
